<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.5" stop-color="#16223c"/>
      <stop offset="1" stop-color="#243a63"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fdf4d8"/>
      <stop offset="0.6" stop-color="#f5e3b3"/>
      <stop offset="1" stop-color="#e2c488"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7d488" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7d488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crossGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a6cf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fb3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4a6cf7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="260" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="380" cy="70" r="1.8" opacity="0.85"/>
    <circle cx="520" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="700" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="880" cy="130" r="1.2" opacity="0.65"/>
    <circle cx="1050" cy="80" r="1.7" opacity="0.9"/>
    <circle cx="1220" cy="160" r="1.3" opacity="0.7"/>
    <circle cx="1380" cy="90" r="1.8" opacity="0.85"/>
    <circle cx="1500" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="640" cy="250" r="1.4" opacity="0.75"/>
    <circle cx="180" cy="320" r="1.5" opacity="0.7"/>
    <circle cx="1450" cy="330" r="1.4" opacity="0.65"/>
    <circle cx="760" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="310" cy="270" r="1.1" opacity="0.6"/>
  </g>

  <!-- moon + halo -->
  <circle cx="1230" cy="180" r="150" fill="url(#glow)"/>
  <circle cx="1230" cy="180" r="62" fill="url(#moon)"/>
  <circle cx="1210" cy="160" r="10" fill="#e3c98e" opacity="0.5"/>
  <circle cx="1250" cy="195" r="7" fill="#e3c98e" opacity="0.45"/>
  <circle cx="1235" cy="215" r="5" fill="#e3c98e" opacity="0.4"/>

  <!-- rolling hills -->
  <path d="M0 640 Q 260 560 520 620 T 1040 610 T 1600 600 L 1600 900 L 0 900 Z" fill="#13223c"/>
  <path d="M0 690 Q 300 620 620 670 T 1240 660 T 1600 650 L 1600 900 L 0 900 Z" fill="#0c1830"/>
  <path d="M0 760 Q 320 700 660 740 T 1380 730 L 1600 720 L 1600 900 L 0 900 Z" fill="#081124"/>

  <!-- church silhouette -->
  <!-- steeple -->
  <g fill="#0a1326">
    <path d="M795 470 L800 380 L805 470 Z"/>
    <rect x="786" y="430" width="28" height="12" rx="2"/>
    <!-- cross on top -->
    <path d="M799 352 h3 v8 h7 v4 h-7 v8 h-3 v-8 h-7 v-4 h7 Z" fill="#f5e3b3"/>
    <!-- body -->
    <rect x="730" y="510" width="140" height="130"/>
    <path d="M800 470 L720 512 L800 512 Z"/>
    <path d="M800 470 L880 512 L800 512 Z"/>
    <path d="M862 512 L800 470 L800 512 Z"/>
    <!-- nave windows -->
    <rect x="752" y="560" width="26" height="52" rx="13" fill="#f5e3b3"/>
    <rect x="822" y="560" width="26" height="52" rx="13" fill="#f5e3b3"/>
    <!-- rose window -->
    <circle cx="800" cy="548" r="14" fill="#f5e3b3"/>
    <!-- side wings -->
    <rect x="692" y="600" width="44" height="42"/>
    <rect x="862" y="600" width="44" height="42"/>
  </g>

  <!-- warm window light -->
  <g fill="#ffd98a">
    <circle cx="800" cy="548" r="8" opacity="0.85"/>
    <rect x="758" y="568" width="14" height="36" rx="7" opacity="0.8"/>
    <rect x="828" y="568" width="14" height="36" rx="7" opacity="0.8"/>
  </g>
  <path d="M800 640 Q 660 620 560 618" stroke="url(#crossGlow)" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- foreground grass -->
  <path d="M0 820 Q 400 780 800 810 T 1600 800 L 1600 900 L 0 900 Z" fill="#060d1c"/>

  <!-- light rays from cross -->
  <g stroke="#8fb3ff" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="800" y1="352" x2="600" y2="140"/>
    <line x1="800" y1="352" x2="950" y2="100"/>
    <line x1="800" y1="352" x2="400" y2="330"/>
    <line x1="800" y1="352" x2="1200" y2="300"/>
  </g>
</svg>